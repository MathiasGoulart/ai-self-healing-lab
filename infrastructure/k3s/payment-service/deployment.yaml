apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ai-self-healing
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: ai-self-healing-lab
    experiment.component: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/part-of: ai-self-healing-lab
        experiment.component: payment
    spec:
      containers:
        - name: payment-service
          # Built by .github/workflows/publish-images.yml → GHCR
          image: ghcr.io/mathiasgoulart/ai-self-healing-lab/payment-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ai-self-healing
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: ai-self-healing-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - name: http
      port: 3001
      targetPort: http
