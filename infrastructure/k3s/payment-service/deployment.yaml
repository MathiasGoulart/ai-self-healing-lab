apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ai-self-healing
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: ai-self-healing-lab
    experiment.component: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/part-of: ai-self-healing-lab
        experiment.component: payment
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets:
        # Required while GHCR packages are private. See order-service deployment notes.
        - name: ghcr-pull
      containers:
        - name: payment-service
          # Tag is pinned in ../kustomization.yaml (sha-<commit>). Do not use :latest for experiments.
          image: ghcr.io/mathiasgoulart/ai-self-healing-lab/payment-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ai-self-healing
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: ai-self-healing-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - name: http
      port: 3001
      targetPort: http
