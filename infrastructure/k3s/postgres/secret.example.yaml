# Lab-only example credentials. Do not use outside the research cluster.
# Create the real Secret with:
#   kubectl -n ai-self-healing create secret generic postgres-credentials \
#     --from-literal=POSTGRES_USER=orders \
#     --from-literal=POSTGRES_PASSWORD='<password>' \
#     --from-literal=POSTGRES_DB=orders \
#     --from-literal=DATABASE_URL='postgres://orders:<password>@postgres:5432/orders'
#
# Or copy this file to secret.yaml (gitignored) and apply it.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ai-self-healing
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ai-self-healing-lab
type: Opaque
stringData:
  POSTGRES_USER: orders
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: orders
  DATABASE_URL: postgres://orders:CHANGE_ME@postgres:5432/orders
