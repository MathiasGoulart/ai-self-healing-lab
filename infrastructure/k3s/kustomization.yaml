apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-self-healing

resources:
  - namespace.yaml
  - postgres/configmap.yaml
  - postgres/deployment.yaml
  - payment-service/deployment.yaml
  - order-service/deployment.yaml

# Single place to pin research experiment images.
# Must match GHCR tags published by CI: sha-<short-commit> (7-char git SHA).
# Do NOT use latest / main / dev / stable for experimental runs.
images:
  - name: ghcr.io/mathiasgoulart/ai-self-healing-lab/order-service
    newTag: sha-e48856b
  - name: ghcr.io/mathiasgoulart/ai-self-healing-lab/payment-service
    newTag: sha-e48856b
